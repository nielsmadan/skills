name: sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"

      - name: Clone source repo
        run: git clone --depth 1 https://github.com/nielsmadan/agentic-coding.git "$RUNNER_TEMP/ac"

      - name: Install loadout
        run: pip install -r "$RUNNER_TEMP/ac/publish/requirements.txt"

      - name: Render
        run: python3 "$RUNNER_TEMP/ac/publish/sync.py" --out .

      - name: Commit if changed
        run: |
          git add -A -- . ':!.github'
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync skills from agentic-coding@$(git -C "$RUNNER_TEMP/ac" rev-parse --short HEAD)"
          git push
