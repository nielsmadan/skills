name: sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Clone source repo
        run: git clone --depth 1 https://github.com/nielsmadan/agentic-coding.git "$RUNNER_TEMP/ac"

      - name: Install loadout
        run: pip install "git+https://github.com/nielsmadan/loadout@86abb1b378ad7d69cccc4b986009a3f84eb98ccb"

      - name: Render
        run: python3 "$RUNNER_TEMP/ac/publish/sync.py" --out .

      - name: Commit if changed
        run: |
          git add -A -- skills README.md LICENSE .claude-plugin
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync skills from agentic-coding"
          git push
